[project]
name = "omniref"
version = "0.1.0"
description = "MCP server and agent skills: one interface to search image and video references across many engines, for AI generation workflows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kaustubh Agrawal", email = "kaustubhkagrawal@gmail.com" }
]
keywords = ["mcp", "fastmcp", "ai-video", "reference-to-video", "image-search", "video-search"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.1.6",
]

[project.scripts]
omniref = "omniref.server:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "ASYNC"]
